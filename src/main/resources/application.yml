spring:
  application:
    name: jm-notification
  config:
    # Carga el .env como properties. Antes lo hacía spring-dotenv, que se registra vía
    # META-INF/spring.factories: Spring Boot 4 ya no lee ese fichero, así que el .env se
    # ignoraba en silencio y toda la configuración caía a los defaults de este YAML.
    import: optional:file:.env[.properties]
  datasource:
    # El driver se deriva de la URL: así el mismo YAML sirve para Postgres y para H2
    # (los tests apuntan a H2 en memoria sobreescribiendo sólo esta propiedad).
    url: ${DB_URL:jdbc:postgresql://localhost:5433/jm_notification}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
  http:
    clients:
      # Sin timeouts, una llamada colgada a Telegram/Meta bloquea el hilo indefinidamente.
      connect-timeout: ${HTTP_CONNECT_TIMEOUT:5s}
      read-timeout: ${HTTP_READ_TIMEOUT:15s}

server:
  port: ${SERVER_PORT:8050}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

notification:
  auth:
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
    jwt-secret: ${JWT_SECRET:}
    jwt-ttl: ${JWT_TTL:12h}
  email:
    enabled: ${NOTIFICATION_EMAIL_ENABLED:true}
    from: ${MAIL_FROM:}
    password-encryption-key: ${EMAIL_PASSWORD_ENCRYPTION_KEY:}
  whatsapp:
    # Instancia GOWA por defecto: cada dispositivo puede sobrescribir url y credenciales.
    enabled: ${NOTIFICATION_WHATSAPP_ENABLED:false}
    api-url: ${GOWA_API_URL:}
    basic-auth-user: ${GOWA_BASIC_AUTH_USER:}
    basic-auth-password: ${GOWA_BASIC_AUTH_PASSWORD:}
  telegram:
    enabled: ${NOTIFICATION_TELEGRAM_ENABLED:false}
    api-url: ${TELEGRAM_API_URL:https://api.telegram.org}
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
    webhook-url: ${TELEGRAM_WEBHOOK_URL:}
    webhook-auto-register: ${TELEGRAM_WEBHOOK_AUTO_REGISTER:false}
    require-active-subscriber: ${TELEGRAM_REQUIRE_ACTIVE_SUBSCRIBER:true}
    # sendDocument sube el fichero: necesita mucho mas margen que una llamada de texto.
    upload-connect-timeout: ${TELEGRAM_UPLOAD_CONNECT_TIMEOUT:10s}
    upload-read-timeout: ${TELEGRAM_UPLOAD_READ_TIMEOUT:2m}
    welcome-message: ${TELEGRAM_WELCOME_MESSAGE:Suscripcion activa. Ya puedes recibir notificaciones.}
    goodbye-message: ${TELEGRAM_GOODBYE_MESSAGE:Suscripcion cancelada. Usa /start para volver a activarla.}
